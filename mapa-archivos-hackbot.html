</head><body><header><h1>Mapa de archivos &#8212; Hackbot ProjectMajorTom</h1><span class='h'>barra color = categor&iacute;a &middot; punteado = enlace &middot; clic = detalle &middot; +/&#8722; = expandir &middot; arrastrar = mover &middot; rueda = zoom</span><button onclick='A(0)'>Expandir todo</button><button onclick='A(1)'>Colapsar todo</button><button onclick='R()'>Reiniciar vista</button></header><div id='w'><div id='b'><svg id='m' xmlns='http://www.w3.org/2000/svg'></svg></div><div id='p'></div></div><script>var DATA={"id":"conectaia","ki":"dir","la":"~/ProjectMajorTom","su":"repo git del hackbot","ca":"root","de":"Carpeta raíz del sistema (versionada en git). Contiene el cerebro (brain/), los proyectos de pentest (pentest/) y los scripts de automatización.","ch":[{"id":"agents","ki":"file","la":"AGENTS.md","su":"perfil del operador","ca":"cfg","de":"Reglas transversales: confirmaciones antes de acciones destructivas, timestamps UTC, no asumir alcance, política TLP:AMBER/RED. Es tu contrato con cualquier agente."},{"id":"claudglob","ki":"file","la":"CLAUDE-global.md","su":"respaldo versionado","ca":"sys","de":"Copia en git de ~/.claude/CLAUDE.md (la memoria global). Si reinstalas, se restaura desde aquí."},{"id":"brain","ki":"dir","la":"brain/","su":"el cerebro","ca":"brain","de":"Lo más valuable del sistema: metodología codificada + aprendizaje acumulado. Versionado en git con historial de promociones.","ch":[{"id":"learnings","ki":"file","la":"LEARNINGS.md","su":"registro de aprendizaje","ca":"brain","de":"Tabla: fecha | proyecto | fase/skill | observación | propuesta | estado. Estados: pendiente → validada (operador) → promovible (3×) → skill. El agente propone aquí; solo el operador promueve."},{"id":"skills","ki":"dir","la":"skills/","su":"8 skills en markdown","ca":"brain","de":"Cada carpeta = un SKILL.md con frontmatter (name/description) que Claude Code carga al arrancar vía enlace ~/.claude/skills.","ch":[{"id":"recon","ki":"file","la":"recon/SKILL.md","su":"fase 1","ca":"brain","de":"Subdominios pasivos (subfinder) + sondeo HTTP multi-puerto con httpx de sintaxis completa → spec/01-recon/. Gate G2: sin SCOPE.md no hay scan."},{"id":"jsa","ki":"file","la":"js-analyze/SKILL.md","su":"fase 2 (2 partes)","ca":"brain","de":"Anti completion bias: fase 1 discover/download (inline, lazy, histórico waymore, source maps) y fase 2 analyze (endpoints.jsonl, secretos, gadgets)."},{"id":"cd","ki":"file","la":"content-discovery/SKILL.md","su":"fase 3","ca":"brain","de":"ffuf con SecLists genérica + wordlist personalizada derivada del JS del objetivo (framework, paths de API). → spec/03-content/."},{"id":"vs","ki":"file","la":"vuln-scan/SKILL.md","su":"fase 4","ca":"brain","de":"nuclei + subagentes por categoría: BOLA/IDOR, BFLA, XSS (4 tipos), SSRF en 2 fases. Todo candidato validado a mano con evidencia nonzero."},{"id":"rp","ki":"file","la":"report/SKILL.md","su":"fase 5","ca":"brain","de":"REPORTE.md consolidado. Anti-inflación: sin prueba de impacto real la severidad baja un nivel."},{"id":"rv","ki":"file","la":"review/SKILL.md","su":"auditor","ca":"cfg","de":"El control de calidad: LEDGER 100% + artefactos nonzero (test -s) + auditoría de alcance (gate G3). Veredicto PASS/FAIL + nudge prompt."},{"id":"rt","ki":"file","la":"retro/SKILL.md","su":"post-corrida","ca":"brain","de":"Analiza nudges/FAILs/falsos positivos y propone correcciones en LEARNINGS.md. Regla dura: NUNCA edita skills."},{"id":"cg","ki":"file","la":"conglomerar/SKILL.md","su":"multi-harness","ca":"brain","de":"Fusiona findings de corridas claude/opencode/kimi: dedup, tabla de atribución, hallazgos únicos por harness (patrón Armada)."}]}]},{"id":"pentest","ki":"dir","la":"pentest/","su":"un caso por carpeta","ca":"proj","de":"Cada engagement es un subdirectorio creado por nuevo-pentest.sh. Nunca mezclar corridas de distintos harness en la misma carpeta.","ch":[{"id":"templates","ki":"dir","la":"_templates/","su":"plantillas","ca":"cfg","de":"La fuente de los orquestadores. nuevo-pentest.sh copia de aquí.","ch":[{"id":"tw","ki":"file","la":"CLAUDE-web.md","su":"orquestador web","ca":"cfg","de":"Hard gates (tabla de fases), LEDGER, nudge, autoridad de SCOPE, reglas de contexto (rutas absolutas, sintaxis completa)."},{"id":"ta","ki":"file","la":"CLAUDE-api.md","su":"orquestador API","ca":"cfg","de":"Igual + foco API Security Top 10: BOLA por endpoint con ID, BFLA con token de usuario, rutas /v1 /v2 /swagger /graphql."},{"id":"ts","ki":"file","la":"SCOPE-template.md","su":"esqueleto de alcance","ca":"target","de":"Formato: un objetivo por línea. Gate G1 aborta la corrida si queda vacío o sin líneas válidas."}]},{"id":"crapi","ki":"dir","la":"crAPI/","su":"proyecto de prueba","ca":"proj","de":"Engagement de ejemplo contra crAPI (localhost:8888) — el benchmark del sistema.","ch":[{"id":"cm","ki":"file","la":"CLAUDE.md","su":"orquestador del proyecto","ca":"cfg","de":"Copia de _templates/CLAUDE-api.md + snippet de aprendizaje. Claude Code lo lee al arrancar en esta carpeta."},{"id":"am","ki":"file","la":"AGENTS.md","su":"para opencode/kimi","ca":"cfg","de":"Mismo orquestador; lo leen los harness que no usan CLAUDE.md."},{"id":"scope","ki":"file","la":"SCOPE.md","su":"¡la única verdad!","ca":"target","de":"Objetivos autorizados. Tres gates lo protegen: G1 (launcher aborta si vacío), G2 (recon paso 1 se detiene), G3 (review audita hosts post-corrida)."},{"id":"cs","ki":"file","la":"costo.sh","su":"wrapper de costo","ca":"script","de":"Ejecuta ~/ProjectMajorTom/costo-corrida.sh con el nombre de ESTE proyecto: ./costo.sh [horas]."},{"id":"led","ki":"file","la":"LEDGER.md","su":"lo crea el agente","ca":"proj","de":"Libro mayor de checkboxes de la corrida. Sin check = paso no hecho. review exige 100%."},{"id":"spec","ki":"dir","la":"spec/","su":"evidencia de recon","ca":"proj","de":"01-recon/ (subdomains, httpx.json, probed) · 02-js/ (endpoints.jsonl, secrets) · 03-content/ (ffuf). Artefactos nonzero = paso ejecutado."},{"id":"traf","ki":"dir","la":"traffic/","su":"capturas","ca":"proj","de":"Tráfico capturado (Interceptor/proxy) para sitios con anti-automatización o JS lazy-loaded."},{"id":"scr","ki":"dir","la":"scripts/","su":"helpers del proyecto","ca":"proj","de":"Scripts que el agente genera durante la corrida para este objetivo."},{"id":"find","ki":"dir","la":"findings/","su":"hallazgos","ca":"proj","de":"REPORTE.md final + un .md por vulnerabilidad confirmada + evidence/ (requests/responses nonzero, curls de reproducción). Está en .gitignore — puede tener datos sensibles."}]}]},{"id":"automat","ki":"dir","la":"scripts (*.sh)","su":"automatización raíz","ca":"script","de":"Los ejecutables que orquestan el ciclo de vida del pentest.","ch":[{"id":"ih","ki":"file","la":"install-hackbot.sh","su":"instalador","ca":"script","de":"Autocontenido: embebe los 6 skills + templates + launcher en heredocs. Reconstruye todo desde cero."},{"id":"np","ki":"file","la":"nuevo-pentest.sh","su":"abre un caso","ca":"script","de":"Crea carpetas, copia orquestador según tipo (api/web), SCOPE en blanco, costo.sh. v2+: tercer parámetro crea proyecto por harness (crAPI-claude, etc.)."},{"id":"hr","ki":"file","la":"hackbot-run.sh","su":"ejecuta el ciclo","ca":"script","de":"Gate G1 (aborta si SCOPE vacío) → lanza claude con el prompt del ciclo → post-corrida registra el costo en costos.log."},{"id":"cc","ki":"file","la":"costo-corrida.sh","su":"tokens → USD","ca":"script","de":"Suma input/output/cache de los JSONL de sesión en ~/.claude/projects/, convierte con precios editables y reporta promedio por corrida."},{"id":"vh","ki":"file","la":"verificar-hackbot.sh","su":"32 chequeos","ca":"script","de":"PASS/FAIL de toda la instalación: enlaces, skills nonzero, templates, gates, herramientas de Kali. Cada FAIL dice cómo corregir."},{"id":"mh","ki":"file","la":"multi-hackbot-run.sh","su":"multi-harness","ca":"script","de":"Prepara corridas paralelas por harness con findings separados (patrón para comparar modelos)."},{"id":"cl","ki":"file","la":"costos.log","su":"historial de costos","ca":"script","de":"Lo escribe hackbot-run.sh tras cada corrida: fecha UTC + totales. Es la serie de tu baseline."},{"id":"mh2","ki":"file","la":"mapa-hackbot.html","su":"este mapa","ca":"script","de":"Mapa neuronal offline de la arquitectura (versión anterior). Ábrelo con xdg-open."}]},{"id":"outside","ki":"dir","la":"~/.claude/","su":"fuera de ProjectMajorTom","ca":"sys","de":"Configuración de Claude Code. Conectada con ProjectMajorTom por enlaces simbólicos — el cerebro físico vive en brain/.","ch":[{"id":"lsk","ki":"link","la":"skills → brain/skills","su":"enlace simbólico","ca":"sys","de":"Claude Code carga los skills desde aquí al arrancar. Enlace por skill (robusto: si la carpeta se regenera, solo se pierden enlaces)."},{"id":"lg","ki":"file","la":"CLAUDE.md","su":"memoria global","ca":"sys","de":"Se carga en CADA proyecto: lee LEARNINGS.md al inicio y registra correcciones en caliente cuando el operador corrige al agente."},{"id":"ll","ki":"link","la":"LEARNINGS.md → brain","su":"enlace simbólico","ca":"sys","de":"El registro de aprendizaje es un solo archivo físico en brain/; aquí solo hay el acceso."}]}]};
var C={root:'var(--kimi-chart-1,#58a6ff)',cfg:'var(--kimi-chart-1,#79c0ff)',brain:'var(--kimi-chart-3,#56d364)',proj:'var(--kimi-chart-4,#d2a8ff)',script:'var(--kimi-chart-2,#f0b72f)',sys:'var(--kimi-chart-5,#8b949e)',target:'var(--kimi-color-danger,#f85149)'};

window.onerror=function(msg,a,l){PN.innerHTML='<h2>Error JS</h2><div class="d">'+esc(msg)+' (linea '+l+')</div>';};

function wk(n,p){n._p=p;IDX[n.id]=n;var c=n.ch||[];for(var i=0;i<c.length;i++)wk(c[i],n);}
function lay(){var k=0;(function r(n,dp){n._d=dp;var c=n.ch;if(c&&c.length&&!coll[n.id]){for(var i=0;i<c.length;i++)r(c[i],dp+1);n._y=(c[0]._y+c[c.length-1]._y)/2;}else{n._y=k*(H+GY);k++;}n._x=dp*(W+GX);})(D,0);return k;}
function rend(){
 var leaves=lay(),md=0;
 (function f(n){if(n._d>md)md=n._d;var c=n.ch||[];for(var i=0;i<c.length;i++)f(c[i]);})(D);
 var s='<g transform="translate('+tx+','+ty+') scale('+sc+')">';
 (function e(n){var c=n.ch;if(c&&c.length&&!coll[n.id])for(var i=0;i<c.length;i++){var q=c[i],x1=n._x+W,y1=n._y+H/2,x2=q._x,y2=q._y+H/2,mx=(x1+x2)/2,hot=(q.id===sel||n.id===sel);
 s+='<path d="M'+x1+','+y1+' C'+mx+','+y1+' '+mx+','+y2+' '+x2+','+y2+'" fill="none" stroke="'+(hot?(C[q.ca]||C.root):B)+'" stroke-width="'+(hot?1.8:1.1)+'"/>';e(q);}})(D);
 (function nd(n){var c=C[n.ca]||C.root,sn=n.id===sel;
 s+='<g transform="translate('+n._x+','+n._y+')" style="cursor:pointer" data-i="'+n.id+'">';
 s+='<rect width="'+W+'" height="'+H+'" rx="8" fill="'+S+'" stroke="'+(sn?c:B)+'" stroke-width="'+(sn?2:1)+'"'+(n.ki==='l'?' stroke-dasharray="4 3"':'')+'/>';
 s+='<rect width="4" height="'+H+'" rx="2" fill="'+c+'"/>';

 if(n._p)h+='<br><button data-g="'+n._p.id+'">&larr; subir a '+esc(n._p.la)+'</button>';

 var g=e.target.closest&&e.target.closest('g[data-i]');if(g){sel=g.getAttribute('data-i');rend();}});
